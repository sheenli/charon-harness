name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/dsh-plugin-subscriptions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-subscriptions
          path: plugins/dsh-plugin-subscriptions/dist/*.tgz
          if-no-files-found: error

  # macOS：未签名 universal DMG
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install fork deps
        working-directory: upstream/deepseek-harness-desktop
        run: yarn install --immutable
      - name: Build unsigned DMG
        working-directory: upstream/deepseek-harness-desktop
        run: yarn dist:mac-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: charon-harness-desktop-macos
          path: upstream/deepseek-harness-desktop/dsh-plugin-desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  # Windows：未签名 NSIS 安装包 + 便携 zip
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install fork deps
        working-directory: upstream/deepseek-harness-desktop
        run: yarn install --immutable
      - name: Build NSIS installer
        working-directory: upstream/deepseek-harness-desktop
        run: yarn dist:win
      - name: Build portable zip
        working-directory: upstream/deepseek-harness-desktop
        run: yarn dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: charon-harness-desktop-windows
          path: |
            upstream/deepseek-harness-desktop/dsh-plugin-desktop/dist/*.exe
            upstream/deepseek-harness-desktop/dsh-plugin-desktop/dist/*.zip
          if-no-files-found: error
